[package]
name = "chainlink-blocker"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "USB-keyed accountability website blocker for Windows"

[[bin]]
name = "chainlink"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
getrandom = "0.3"
pbkdf2 = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.23"
url = "2.5"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["high-dpi", "textbox"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"

